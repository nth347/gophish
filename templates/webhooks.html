{{define "body"}}
<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
    <h1 class="page-header">
        {{.Title}}
    </h1>
    <div id="flashes" class="row"></div>
    <div class="row">
        <button type="button" class="btn btn-primary" id="new_button" data-toggle="modal" data-backdrop="static"
            data-webhook-id="-1" data-target="#modal">
            <i class="fa fa-plus"></i> New Webhook</button>
    </div>
    &nbsp;
    <div id="loading">
        <i class="fa fa-spinner fa-spin fa-4x"></i>
    </div>
    <div class="row">
        <table id="webhookTable" class="table" style="display:none;">
            <thead>
                <tr>
                    <th class="col-md-2 no-sort">Title</th>
                    <th class="col-md-2 no-sort">Url</th>
                    <th class="col-md-2 no-">Is active</th>
                    <th class="col-md-2 no-sort"></th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="modalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="webhookModalLabel">Add or Edit Webhook</h4>
            </div>
            <div class="modal-body" id="modal_body">
                <div class="row" id="modal.flashes"></div>
                <label class="control-label" for="title">Name:</label>
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="Name" id="name" required autofocus />
                </div>

                <label class="control-label" for="type">Type:</label>
                <div class="form-group">
                    <select class="form-control" id="type">
                        <option value="standard">Standard (HTTP + HMAC)</option>
                        <option value="telegram">Telegram</option>
                        <option value="http_api">HTTP API</option>
                    </select>
                </div>

                <!-- Standard (HTTP) webhook fields -->
                <div id="standard_fields">
                    <label class="control-label" for="url">URL:</label>
                    <div class="form-group">
                        <input type="text" class="form-control" placeholder="https://example.com/webhook1" id="url" />
                    </div>

                    <label class="control-label" for="secret">Secret:</label>
                    <div class="form-group">
                        <input type="text" class="form-control" placeholder="Secret" id="secret" />
                    </div>
                </div>

                <!-- HTTP API webhook fields -->
                <div id="api_fields" style="display:none;">
                    <label class="control-label" for="api_url">URL <i class="fa fa-question-circle"
                            data-toggle="tooltip" data-placement="right"
                            title="The API endpoint to POST captured data to. Receives a JSON body with campaign_id, email, event, time, and form_data fields."></i>:</label>
                    <div class="form-group">
                        <input type="text" class="form-control" placeholder="https://api.example.com/captures" id="api_url" />
                    </div>

                    <label class="control-label" for="api_method">HTTP Method:</label>
                    <div class="form-group">
                        <select class="form-control" id="api_method">
                            <option value="POST">POST</option>
                            <option value="PUT">PUT</option>
                            <option value="PATCH">PATCH</option>
                            <option value="GET">GET</option>
                        </select>
                    </div>

                    <label class="control-label">Custom Headers <i class="fa fa-question-circle"
                            data-toggle="tooltip" data-placement="right"
                            title="Add HTTP headers for authentication or routing, e.g. Authorization: Bearer &lt;token&gt; or X-API-Key: &lt;key&gt;."></i>:</label>
                    <div id="api_headers_list"></div>
                    <div class="form-group" style="margin-top:6px;">
                        <button type="button" class="btn btn-default btn-sm" id="add_api_header">
                            <i class="fa fa-plus"></i> Add Header
                        </button>
                    </div>

                    <label class="control-label">Validation filters <i class="fa fa-question-circle"
                            data-toggle="tooltip" data-placement="right"
                            title="For Submitted Data events, only send the request when the captured data satisfies at least one condition: valid credentials (username+password both enabled and valid) OR valid tokens. When no toggles are enabled, all Submitted Data events are forwarded."></i>:</label>
                    <div class="form-group">
                        <div class="checkbox checkbox-primary" style="margin:0">
                            <input type="checkbox" id="api_include_username" value="true" />
                            <label for="api_include_username">Require username</label>
                        </div>
                        <div class="checkbox checkbox-primary" style="margin:0">
                            <input type="checkbox" id="api_include_password" value="true" />
                            <label for="api_include_password">Require password</label>
                        </div>
                        <div class="checkbox checkbox-primary" style="margin:0">
                            <input type="checkbox" id="api_include_tokens" value="true" />
                            <label for="api_include_tokens">Require tokens / cookies</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="api_username_pattern" style="font-weight:normal">Username pattern (regex)</label>
                        <input type="text" class="form-control" placeholder="e.g. @corp\.com$ (leave empty for all)" id="api_username_pattern" />
                    </div>
                    <div class="form-group">
                        <label for="api_min_password_length" style="font-weight:normal">Min password length</label>
                        <input type="number" min="0" class="form-control" placeholder="0 = no minimum" id="api_min_password_length" value="0" />
                    </div>
                    <div class="form-group">
                        <label for="api_min_token_length" style="font-weight:normal">Min token/cookie length</label>
                        <input type="number" min="0" class="form-control" placeholder="0 = no minimum" id="api_min_token_length" value="0" />
                    </div>
                </div>

                <!-- Telegram webhook fields -->
                <div id="telegram_fields" style="display:none;">
                    <label class="control-label" for="telegram_bot_token">Bot Token <i class="fa fa-question-circle"
                            data-toggle="tooltip" data-placement="right"
                            title="The token of your Telegram bot, obtained from @BotFather (e.g. 123456:ABC-DEF...)."></i>:</label>
                    <div class="form-group">
                        <input type="text" class="form-control" placeholder="123456789:ABCdef..." id="telegram_bot_token" />
                    </div>

                    <label class="control-label" for="telegram_chat_id">Chat ID <i class="fa fa-question-circle"
                            data-toggle="tooltip" data-placement="right"
                            title="The chat/channel/group ID to send notifications to. Get it from @userinfobot or the getUpdates API."></i>:</label>
                    <div class="form-group">
                        <input type="text" class="form-control" placeholder="-1001234567890" id="telegram_chat_id" />
                    </div>

                    <label class="control-label">Include in Submitted Data messages <i class="fa fa-question-circle"
                            data-toggle="tooltip" data-placement="right"
                            title="When a target submits data, optionally include the captured credentials in the Telegram message. A notification is only sent when at least credentials (username+password) or tokens are captured."></i>:</label>
                    <div class="form-group">
                        <div class="checkbox checkbox-primary" style="margin:0">
                            <input type="checkbox" id="telegram_include_username" value="true" />
                            <label for="telegram_include_username">Include username</label>
                        </div>
                        <div class="checkbox checkbox-primary" style="margin:0">
                            <input type="checkbox" id="telegram_include_password" value="true" />
                            <label for="telegram_include_password">Include password</label>
                        </div>
                        <div class="checkbox checkbox-primary" style="margin:0">
                            <input type="checkbox" id="telegram_include_tokens" value="true" />
                            <label for="telegram_include_tokens">Include tokens / cookies <i class="fa fa-question-circle"
                                data-toggle="tooltip" data-placement="right"
                                title="Telegram messages are capped at 4096 characters. Token/cookie blobs that exceed the available space are automatically truncated with a note."></i></label>
                        </div>
                    </div>

                    <label class="control-label">Validation filters <i class="fa fa-question-circle"
                            data-toggle="tooltip" data-placement="right"
                            title="Filter notifications: only send when the captured data meets these criteria. Leave username pattern empty to accept all. Set minimum lengths to 0 for no minimum."></i>:</label>
                    <div class="form-group">
                        <label for="telegram_username_pattern" style="font-weight:normal">Username pattern (regex)</label>
                        <input type="text" class="form-control" placeholder="e.g. @corp\.com$ (leave empty for all)" id="telegram_username_pattern" />
                    </div>
                    <div class="form-group">
                        <label for="telegram_min_password_length" style="font-weight:normal">Min password length</label>
                        <input type="number" min="0" class="form-control" placeholder="0 = no minimum" id="telegram_min_password_length" value="0" />
                    </div>
                    <div class="form-group">
                        <label for="telegram_min_token_length" style="font-weight:normal">Min token/cookie length</label>
                        <input type="number" min="0" class="form-control" placeholder="0 = no minimum" id="telegram_min_token_length" value="0" />
                    </div>
                </div>

                <label class="control-label">Notify on events <i class="fa fa-question-circle"
                        data-toggle="tooltip" data-placement="right"
                        title="Which campaign events trigger this webhook. By default only Submitted Data is sent."></i>:</label>
                <div class="form-group">
                    <div class="checkbox checkbox-primary" style="margin:0">
                        <input type="checkbox" id="event_sent" value="sent" />
                        <label for="event_sent">Email Sent</label>
                    </div>
                    <div class="checkbox checkbox-primary" style="margin:0">
                        <input type="checkbox" id="event_opened" value="opened" />
                        <label for="event_opened">Email Opened</label>
                    </div>
                    <div class="checkbox checkbox-primary" style="margin:0">
                        <input type="checkbox" id="event_clicked" value="clicked" />
                        <label for="event_clicked">Clicked Link</label>
                    </div>
                    <div class="checkbox checkbox-primary" style="margin:0">
                        <input type="checkbox" id="event_submitted" value="submitted" />
                        <label for="event_submitted">Submitted Data</label>
                    </div>
                    <div class="checkbox checkbox-primary" style="margin:0">
                        <input type="checkbox" id="event_reported" value="reported" />
                        <label for="event_reported">Email Reported</label>
                    </div>
                </div>

                <div class="checkbox checkbox-primary">
                    <input type="checkbox" id="is_active" value="true" />
                    <label for="is_active">Is active <i class="fa fa-question-circle"
                            data-toggle="tooltip" data-placement="right"
                            title="Data is sent only to the active webhooks"></i>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                <button type="button" class="btn btn-warning" id="testRequestBtn" style="display:none;">
                    <i class="fa fa-paper-plane"></i> Test Request
                </button>
                <button type="button" class="btn btn-primary" id="modalSubmit">Save changes</button>
            </div>
        </div>
    </div>
</div>


{{end}} {{define "scripts"}}
<script src="/js/dist/app/webhooks.min.js"></script>
{{end}}
