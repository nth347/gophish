{{define "body"}}
<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
    <h1 class="page-header">
        {{.Title}}
    </h1>
    <div id="flashes" class="row"></div>
    <div class="row">
        <button type="button" class="btn btn-primary" id="new_button" data-toggle="modal" data-backdrop="static"
            data-webhook-id="-1" data-target="#modal">
            <i class="fa fa-plus"></i> New Webhook</button>
    </div>
    &nbsp;
    <div id="loading">
        <i class="fa fa-spinner fa-spin fa-4x"></i>
    </div>
    <div class="row">
        <table id="webhookTable" class="table" style="display:none;">
            <thead>
                <tr>
                    <th class="col-md-2 no-sort">Title</th>
                    <th class="col-md-2 no-sort">Url</th>
                    <th class="col-md-2 no-">Is active</th>
                    <th class="col-md-2 no-sort"></th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="modalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="webhookModalLabel">Add or Edit Webhook</h4>
            </div>
            <div class="modal-body" id="modal_body">
                <div class="row" id="modal.flashes"></div>
                <label class="control-label" for="title">Name:</label>
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="Name" id="name" required autofocus />
                </div>

                <label class="control-label" for="type">Type:</label>
                <div class="form-group">
                    <select class="form-control" id="type">
                        <option value="standard">Standard (HTTP)</option>
                        <option value="telegram">Telegram</option>
                    </select>
                </div>

                <!-- Standard (HTTP) webhook fields -->
                <div id="standard_fields">
                    <label class="control-label" for="url">URL:</label>
                    <div class="form-group">
                        <input type="text" class="form-control" placeholder="https://example.com/webhook1" id="url" />
                    </div>

                    <label class="control-label" for="secret">Secret:</label>
                    <div class="form-group">
                        <input type="text" class="form-control" placeholder="Secret" id="secret" />
                    </div>
                </div>

                <!-- Telegram webhook fields -->
                <div id="telegram_fields" style="display:none;">
                    <label class="control-label" for="telegram_bot_token">Bot Token <i class="fa fa-question-circle"
                            data-toggle="tooltip" data-placement="right"
                            title="The token of your Telegram bot, obtained from @BotFather (e.g. 123456:ABC-DEF...)."></i>:</label>
                    <div class="form-group">
                        <input type="text" class="form-control" placeholder="123456789:ABCdef..." id="telegram_bot_token" />
                    </div>

                    <label class="control-label" for="telegram_chat_id">Chat ID <i class="fa fa-question-circle"
                            data-toggle="tooltip" data-placement="right"
                            title="The chat/channel/group ID to send notifications to. Get it from @userinfobot or the getUpdates API."></i>:</label>
                    <div class="form-group">
                        <input type="text" class="form-control" placeholder="-1001234567890" id="telegram_chat_id" />
                    </div>
                </div>

                <label class="control-label">Notify on events <i class="fa fa-question-circle"
                        data-toggle="tooltip" data-placement="right"
                        title="Which campaign events trigger this webhook. By default only Submitted Data is sent."></i>:</label>
                <div class="form-group">
                    <div class="checkbox checkbox-primary" style="margin:0">
                        <input type="checkbox" id="event_sent" value="sent" />
                        <label for="event_sent">Email Sent</label>
                    </div>
                    <div class="checkbox checkbox-primary" style="margin:0">
                        <input type="checkbox" id="event_opened" value="opened" />
                        <label for="event_opened">Email Opened</label>
                    </div>
                    <div class="checkbox checkbox-primary" style="margin:0">
                        <input type="checkbox" id="event_clicked" value="clicked" />
                        <label for="event_clicked">Clicked Link</label>
                    </div>
                    <div class="checkbox checkbox-primary" style="margin:0">
                        <input type="checkbox" id="event_submitted" value="submitted" />
                        <label for="event_submitted">Submitted Data</label>
                    </div>
                    <div class="checkbox checkbox-primary" style="margin:0">
                        <input type="checkbox" id="event_reported" value="reported" />
                        <label for="event_reported">Email Reported</label>
                    </div>
                </div>

                <div class="checkbox checkbox-primary">
                    <input type="checkbox" id="is_active" value="true" />
                    <label for="is_active">Is active <i class="fa fa-question-circle"
                            data-toggle="tooltip" data-placement="right"
                            title="Data is sent only to the active webhooks"></i>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="modalSubmit">Save changes</button>
            </div>
        </div>
    </div>
</div>


{{end}} {{define "scripts"}}
<script src="/js/dist/app/webhooks.min.js"></script>
{{end}}
